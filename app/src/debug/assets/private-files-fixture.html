<!doctype html>
<meta charset="utf-8">
<title>Private file bridge fixture</title>
<body>Private file transport fixture</body>
<script>
(() => {
  const pending = new Map();
  let requestSequence = 0;
  window.__privateFileFixture = { state: 'running', error: '' };
  window.HanApp.onmessage = event => {
    let message;
    try { message = JSON.parse(event.data); } catch (_) { return; }
    const waiter = pending.get(message.id);
    if (!waiter) return;
    pending.delete(message.id);
    if (!message.ok) waiter.reject(new Error(message.error || 'bridge_error'));
    else waiter.resolve(message.result || {});
  };
  function request(type, payload) {
    const id = `fixture-${++requestSequence}`;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error(`request_timeout:${type}`)); }, 5000);
      pending.set(id, { resolve: value => { clearTimeout(timer); resolve(value); }, reject: error => { clearTimeout(timer); reject(error); } });
      HanApp.postMessage(JSON.stringify({ version: 1, id, type, payload }));
    });
  }
  function bytesFor(id, sequence, payload) {
    const frame = new Uint8Array(24 + payload.length);
    for (let i = 0; i < 16; i++) frame[i] = parseInt(id.slice(i * 2, i * 2 + 2), 16);
    const view = new DataView(frame.buffer);
    view.setUint32(16, sequence, false);
    view.setUint32(20, payload.length, false);
    frame.set(payload, 24);
    return frame;
  }
  function sendFrame(id, sequence, payload) {
    const correlation = `pf:${id}:${sequence}`;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(correlation); reject(new Error(`frame_timeout:${sequence}`)); }, 5000);
      pending.set(correlation, { resolve: value => { clearTimeout(timer); resolve(value); }, reject: error => { clearTimeout(timer); reject(error); } });
      HanPrivateFileWriter.postMessage(bytesFor(id, sequence, payload).buffer);
    });
  }
  async function sha256(bytes) {
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest), value => value.toString(16).padStart(2, '0')).join('');
  }
  async function run() {
    const probe = await request('privateFiles.probe', { step: 'begin' });
    const probePayload = new Uint8Array(32); crypto.getRandomValues(probePayload);
    await sendFrame(probe.probeId, 0, probePayload);
    const probeRead = new Uint8Array(await (await fetch(probe.url, { cache: 'no-store' })).arrayBuffer());
    if (probeRead.length !== 32) throw new Error('probe_length');
    await request('privateFiles.probe', { step: 'confirm', probeId: probe.probeId, sha256: await sha256(probeRead) });

    const partition = await request('privateFiles.open', { namespace: 'private-cache-v1', bindingLabel: 'a'.repeat(64) });
    const key = 'b'.repeat(64);
    const content = new Uint8Array([0, 1, 2, 127, 128, 255]);
    const write = await request('privateFiles.beginWrite', { partitionHandle: partition.partitionHandle, key, bytes: content.length, mime: 'application/octet-stream' });
    await sendFrame(write.transferId, 0, content);
    const committed = await request('privateFiles.commitWrite', { transferId: write.transferId });
    const read = await request('privateFiles.openRead', { partitionHandle: partition.partitionHandle, key });
    const body = new Uint8Array(await (await fetch(read.url, { cache: 'no-store' })).arrayBuffer());
    if (body.length !== content.length || body.some((value, index) => value !== content[index])) throw new Error('round_trip_mismatch');
    if (await sha256(body) !== committed.sha256) throw new Error('round_trip_hash');
    const secondRead = await fetch(read.url, { cache: 'no-store' });
    if (secondRead.status !== 404) throw new Error('read_token_reused');
    window.__privateFileFixture.state = 'passed';
    HanApp.postMessage(JSON.stringify({ version: 1, id: `fixture-ready-${requestSequence}`, type: 'pageReady', payload: {} }));
  }
  window.runPrivateFileFixture = () => run().catch(error => { window.__privateFileFixture = { state: 'failed', error: String(error && error.message || error) }; });
})();
</script>
