name: Release APK

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer published. Asking for it makes
          # current hosted runners fail before Gradle starts.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi

      # The tag is the single source of the shipped version; see app/build.gradle.kts.
      - name: Derive version from tag
        run: echo "DSH_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        env:
          DSH_KEYSTORE: ${{ runner.temp }}/release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      # GitHub keeps source only. The APK is a short-lived private workflow artifact; publish it to the
      # self-hosted update channel with scripts/publish-app-update.ps1 (docs/DEPLOYMENT.md).
      - uses: actions/upload-artifact@v7
        with:
          name: dsha-apk
          retention-days: 7
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt